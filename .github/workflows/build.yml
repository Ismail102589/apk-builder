# wf-v3
name: Build APK

on:
  push:
    paths:
      - 'upload/project.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q upload/project.zip -d project
          ROOT=""
          for d in 1 2 3 4; do
            F=$(find project -maxdepth $d -name 'settings.gradle*' | head -n1)
            if [ -n "$F" ]; then ROOT=$(dirname "$F"); break; fi
          done
          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle not found - this ZIP is not a Gradle Android project"
            find project -maxdepth 3 | head -40
            exit 1
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Build debug APK
        run: |
          cd "$ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
